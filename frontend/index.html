<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Golden Games - Ludo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <h1>🏆 Golden Games</h1>

    <p class="subtitle">🎲 Ludo Test</p>

    <div class="players">
      <div>
        🔴 Player 1
        <b id="score1">0</b>
      </div>

      <div>
        🔵 Player 2
        <b id="score2">0</b>
      </div>
    </div>

    <div id="board" class="board"></div>

    <div class="turn">
      Turn:
      <b id="turn">Player 1</b>
    </div>

    <div id="dice" class="dice">
      🎲
    </div>

    <button id="roll">
      ROLL DICE
    </button>

    <p id="status">
      Press ROLL DICE to start
    </p>

  </div>

<script>

const board = document.getElementById("board");
const dice = document.getElementById("dice");
const roll = document.getElementById("roll");

const turnText = document.getElementById("turn");
const status = document.getElementById("status");

const score1 = document.getElementById("score1");
const score2 = document.getElementById("score2");

let player = 1;

let positions = [0, 0];

let gameOver = false;


// Create board

for (let i = 0; i < 49; i++) {

  const cell = document.createElement("div");

  cell.className = "cell";

  board.appendChild(cell);

}


// Draw tokens

function drawBoard() {

  document
    .querySelectorAll(".token")
    .forEach(token => token.remove());


  if (positions[0] < 49) {

    const token = document.createElement("div");

    token.className = "token red";

    board.children[positions[0]]
      .appendChild(token);

  }


  if (positions[1] < 49) {

    const token = document.createElement("div");

    token.className = "token blue";

    board.children[positions[1]]
      .appendChild(token);

  }


  score1.textContent = positions[0];

  score2.textContent = positions[1];

}


// Roll dice

roll.onclick = function () {

  if (gameOver) return;


  const number =
    Math.floor(Math.random() * 6) + 1;


  const faces = [
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
  ];


  dice.textContent =
    faces[number - 1];


  positions[player - 1] += number;


  drawBoard();


  if (positions[player - 1] >= 30) {

    status.textContent =
      "🏆 Player " + player + " wins!";

    gameOver = true;

    roll.disabled = true;

    return;

  }


  status.textContent =
    "Player " + player +
    " rolled " + number;


  player =
    player === 1 ? 2 : 1;


  turnText.textContent =
    "Player " + player;

};


// Start

drawBoard();


// Telegram

if (window.Telegram &&
    window.Telegram.WebApp) {

  Telegram.WebApp.ready();

  Telegram.WebApp.expand();

}

</script>

</body>
</html>
